version = "1.0"

[task]
name = "agentic-vbench/pokeshowdown-gen9-randbattle-set-ledger"

[metadata]
difficulty = "hard"
category = "video-understanding"
tags = ["video-understanding", "game-state", "pokemon", "event-timeline", "synthetic-ground-truth", "agentic-vbench-understanding"]
# Five muted Gen9 random battles (Pokemon Showdown open-source sim), played back to
# back. Ground truth = the simulator's own protocol log, frozen per battle and parsed
# into the structural ledger. The rendered replay hides the text battle-log panel, so
# the answer must be read from the animated scene (sprites, HP bars, turn counter).
source = "synthetic: pokemon-showdown gen9randombattle, frozen logs seeds 7-11 (self-hosted on HF)"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 8192
allow_internet = false

[environment.env]
HF_TOKEN = "${HF_TOKEN:-}"

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 3600.0

[steps.verifier]
timeout_sec = 600.0
